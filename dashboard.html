<script>
        const SUPABASE_URL = 'https://ywigafhbswrovuhvnkty.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_A0rzUGADUPuhTod5eU1D1g_8E-d86BQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const WORKSPACE_KEYS = ['scriptText', 'scriptSummary', 'storyboardData', 'extractedData', 'globalRatio', 'llmModelSelect', 'llm_config', 'charactersData'];

        let projects = [];
        let currentView = 'projects';
        let activeProjectId = null;
        let currentShareProjectId = null;

        window.onload = async () => {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return location.replace('index.html');
            window.currentUserEmail = user.email;

            // 1. 🌟 补全：拉取积分并显示
            await loadCredits();

            // 2. 🌟 补全：尝试同步进度（带容错，防止 DB 变量未定义导致崩溃）
            try { if (typeof DB !== 'undefined') await packCurrentWorkspaceToCloud(); } catch(e) { console.warn("Pack 失败:", e); }
            
            await loadProjects();
        };

        // 🌟 补全：加载积分逻辑
        async function loadCredits() {
            try {
                const { data, error } = await supabaseClient.from('profiles').select('credits').eq('user_id', (await supabaseClient.auth.getUser()).data.user.id).single();
                if (data) document.getElementById('headerCredit').innerText = `💎 积分: ${data.credits || 0}`;
            } catch (e) { console.error("积分加载失败"); }
        }

        async function loadProjects() {
            const { data, error } = await supabaseClient.rpc('get_my_projects', { my_email: window.currentUserEmail });
            if (error) { console.error("RPC 加载失败，请确认 SQL 是否运行:", error); return; }

            const isAdmin = data.some(p => p.my_role === 'owner' || p.my_role === 'admin');
            document.getElementById('adminPanelBtn').style.display = isAdmin ? 'inline-flex' : 'none';

            projects = data.map(p => ({
                id: p.id, name: p.name, episodes: p.data.episodes || [], my_role: p.my_role, my_status: p.my_status, members: p.members || []
            }));
            renderView();
        }

        function renderView() {
            const container = document.getElementById('gridContainer');
            const bc = document.getElementById('breadcrumbHeader');
            bc.innerHTML = currentView === 'projects' ? `🏠 工作台` : `<span style="cursor:pointer;color:#86909c" onclick="backToProjects()">🏠 工作台</span> / 项目详情`;
            
            let list = [];
            if (currentView === 'projects') {
                list = [...projects, { _isAdd: true, _type: 'project' }];
            } else {
                const proj = projects.find(p => p.id === activeProjectId);
                list = [...(proj ? proj.episodes : []), { _isAdd: true, _type: 'episode' }];
            }

            container.innerHTML = list.map(item => {
                if (item._isAdd) return `<div class="card" style="border:2px dashed #ccc" onclick="${item._type === 'project' ? 'createProject()' : 'createEpisode()'}">➕ 新建${item._type === 'project'?'项目':'分集'}</div>`;
                
                if (item.my_status === 'pending') {
                    return `<div class="card" style="border:2px solid #ff7875; background:#fff1f0">
                        <div class="card-title">${item.name}</div>
                        <button class="btn btn-primary" style="margin-top:10px" onclick="acceptInvite('${item.id}')">接受邀请</button>
                    </div>`;
                }

                return `
                <div class="card" onclick="${currentView === 'projects' ? `openProject('${item.id}')` : `enterEpisode('${item.id}')`}">
                    <div class="card-actions">
                        <div class="action-icon" title="协作" onclick="event.stopPropagation(); openShareModal('${item.id}')">👥</div>
                        <div class="action-icon" title="删除" onclick="event.stopPropagation(); deleteProject('${item.id}')">🗑️</div>
                    </div>
                    <div class="card-icon">${currentView === 'projects' ? '📁' : '🎬'}</div>
                    <div class="card-title">${item.name}</div>
                </div>`;
            }).join('');
        }

        // 🌟 补全：新建按钮总控
        function handleTopAddClick() {
            if (currentView === 'projects') createProject();
            else createEpisode();
        }

        async function createProject() {
            const name = prompt("请输入项目名称:");
            if (name) {
                const id = 'proj_' + Date.now();
                await supabaseClient.from('shared_projects').insert([{ id, name, owner_email: window.currentUserEmail }]);
                await supabaseClient.from('project_members').insert([{ project_id: id, user_email: window.currentUserEmail, role: 'owner', status: 'active' }]);
                await loadProjects();
            }
        }

        // 🌟 补全：新建分集逻辑
        async function createEpisode() {
            const proj = projects.find(p => p.id === activeProjectId);
            const name = prompt("请输入分集名称:", `第 ${proj.episodes.length + 1} 集`);
            if (name) {
                const newEp = { id: 'ep_' + Date.now(), name, data: {} };
                const updatedEpisodes = [...proj.episodes, newEp];
                await supabaseClient.from('shared_projects').update({ data: { episodes: updatedEpisodes } }).eq('id', activeProjectId);
                await loadProjects();
            }
        }

        // 🌟 补全：删除逻辑
        async function deleteProject(id) {
            if (confirm("确定要删除吗？这将清除云端所有数据。")) {
                await supabaseClient.from('shared_projects').delete().eq('id', id);
                await loadProjects();
            }
        }

        // 🌟 补全：接受邀请逻辑
        async function acceptInvite(id) {
            await supabaseClient.rpc('accept_project_invitation', { p_id: id, p_email: window.currentUserEmail });
            await loadProjects();
        }

        // 🌟 补全：打包同步逻辑
        async function packCurrentWorkspaceToCloud() {
            const ctx = await DB.get('active_context');
            if (ctx && ctx.projectId) {
                let snapshot = {};
                for (let key of WORKSPACE_KEYS) snapshot[key] = await DB.get(key);
                const { data: proj } = await supabaseClient.from('shared_projects').select('data').eq('id', ctx.projectId).single();
                if (proj) {
                    let eps = proj.data.episodes || [];
                    const idx = eps.findIndex(e => e.id === ctx.epId);
                    if (idx !== -1) {
                        eps[idx].data = snapshot;
                        await supabaseClient.from('shared_projects').update({ data: { episodes: eps } }).eq('id', ctx.projectId);
                    }
                }
                for (let key of WORKSPACE_KEYS) await DB.set(key, null);
                await DB.set('active_context', null);
            }
        }

        function openProject(id) { activeProjectId = id; currentView = 'episodes'; renderView(); }
        function backToProjects() { activeProjectId = null; currentView = 'projects'; renderView(); }
        
        function openShareModal(id) {
            currentShareProjectId = id;
            const proj = projects.find(p => p.id === id);
            document.getElementById('memberList').innerHTML = proj.members.map(m => `<div>${m.email} (${m.role}) - ${m.status}</div>`).join('');
            document.getElementById('shareModal').style.display = 'flex';
        }

        async function inviteMember() {
            const email = document.getElementById('inviteEmail').value;
            // 注意：apiRequest 需要在您的 app.js 中定义好
            await apiRequest('/api/project/invite', { projectId: currentShareProjectId, projectName: "剧本项目", inviteeEmail: email, role: 'member' });
            alert("邀请已发送");
            document.getElementById('shareModal').style.display = 'none';
        }

        async function enterEpisode(epId) {
            const proj = projects.find(p => p.id === activeProjectId);
            const ep = proj.episodes.find(e => e.id === epId);
            if (ep.data) {
                for (let key of Object.keys(ep.data)) await DB.set(key, ep.data[key]);
            }
            await DB.set('active_context', { projectId: proj.id, epId: ep.id });
            window.location.href = 'module1.html';
        }
    </script>
