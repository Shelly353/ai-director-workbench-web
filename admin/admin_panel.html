<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 导演 - 剧组 ERP 数据指挥舱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* 1. 基础重置：彻底打碎全局 style.css 的滚动锁 */
        :root {
            --erp-primary: #1677ff;
            --erp-bg: #f4f7f9;
            --erp-text: #1d2129;
            --erp-gray: #86909c;
            --erp-border: #e5e6eb;
        }

        html, body { 
            overflow-y: auto !important; 
            height: auto !important; 
            margin: 0; padding: 0;
            background-color: var(--erp-bg) !important;
            color: var(--erp-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 2. 顶部导航隔离样式 */
        .erp-header {
            background: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--erp-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .erp-breadcrumb { font-size: 14px; font-weight: 500; }
        .erp-breadcrumb span { cursor: pointer; color: var(--erp-primary); }

        .admin-container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }

        /* 3. 选项卡：项目级 */
        .erp-tabs-row { 
            display: flex; gap: 8px; margin-bottom: 20px; 
            overflow-x: auto; padding-bottom: 8px; border-bottom: 1px solid var(--erp-border);
        }
        .erp-tab-p {
            padding: 8px 18px; border-radius: 6px; border: 1px solid var(--erp-border);
            background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap;
            transition: 0.2s;
        }
        .erp-tab-p.active { background: var(--erp-primary); color: #fff; border-color: var(--erp-primary); }

        /* 4. 选项卡：视图级 */
        .erp-view-row { display: flex; gap: 30px; margin-bottom: 20px; }
        .erp-tab-v {
            padding: 10px 0; border: none; background: transparent; 
            font-size: 16px; font-weight: bold; color: var(--erp-gray);
            cursor: pointer; border-bottom: 3px solid transparent;
        }
        .erp-tab-v.active { color: var(--erp-primary); border-bottom-color: var(--erp-primary); }

        /* 5. 数据大盘卡片 */
        .erp-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
        .erp-card-metric {
            background: #fff; padding: 20px; border-radius: 12px; border: 1px solid var(--erp-border);
            text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .erp-m-val { font-size: 28px; font-weight: 800; margin-bottom: 4px; color: var(--erp-text); }
        .erp-m-lab { font-size: 12px; color: var(--erp-gray); font-weight: bold; }

        /* 6. 图表区布局 */
        .erp-chart-row { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 20px; }
        .erp-card-chart {
            background: #fff; padding: 20px; border-radius: 12px; border: 1px solid var(--erp-border);
            min-height: 320px; display: flex; flex-direction: column;
        }
        .erp-c-title { font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

        /* 7. 数据表区：三列布局 */
        .erp-table-row { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 15px; align-items: start; }
        .erp-card-table {
            background: #fff; border-radius: 12px; border: 1px solid var(--erp-border);
            overflow: hidden; height: 550px; display: flex; flex-direction: column;
        }
        .erp-t-header { background: #fafafa; padding: 12px 15px; font-weight: bold; border-bottom: 1px solid var(--erp-border); font-size: 14px; }
        .erp-t-body { flex: 1; overflow-y: auto; }
        
        .erp-table { width: 100%; border-collapse: collapse; }
        .erp-table th { position: sticky; top: 0; background: #fff; padding: 10px 15px; text-align: left; font-size: 12px; color: var(--erp-gray); border-bottom: 1px solid #f2f3f5; z-index: 10; }
        .erp-table td { padding: 12px 15px; font-size: 13px; border-bottom: 1px solid #f2f3f5; }
        .erp-table tr:hover { background: #f9fbfd; }

        /* 徽章 */
        .erp-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .erp-badge-blue { background: #e8f3ff; color: #1677ff; }
        .erp-badge-green { background: #f6ffed; color: #52c41a; }

        .view-section { display: none; }
        .view-section.active { display: block; }
        
        /* 按钮重载 */
        .erp-btn-outline {
            padding: 6px 15px; border-radius: 6px; border: 1px solid var(--erp-primary);
            color: var(--erp-primary); background: transparent; cursor: pointer; font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="erp-header">
        <div class="erp-breadcrumb"><span onclick="location.href='../dashboard.html'">🏠 返回工作台</span> / 📊 数据指挥中心</div>
        <button class="erp-btn-outline" onclick="exportToExcel()">📥 导出 Excel 报表</button>
    </div>

    <div class="admin-container">
        
        <div class="erp-tabs-row" id="projectTabs">
            <div class="erp-tab-p active" onclick="switchProject('all')">全盘总览</div>
        </div>

        <div class="erp-view-row">
            <button class="erp-tab-v active" onclick="switchView('overview')">趋势大盘</button>
            <button class="erp-tab-v" onclick="switchView('members')">成员明细</button>
            <button class="erp-tab-v" onclick="switchView('episodes')">分集内容透视</button>
        </div>

        <div id="view_overview" class="view-section active">
            <div class="erp-grid-4">
                <div class="erp-card-metric"><div class="erp-m-val" id="m_total_cost">0</div><div class="erp-m-lab">累计总消耗</div></div>
                <div class="erp-card-metric"><div class="erp-m-val" id="m_img_count" style="color:var(--erp-primary)">0</div><div class="erp-m-lab">生图频次</div></div>
                <div class="erp-card-metric"><div class="erp-m-val" id="m_text_count" style="color:#faad14">0</div><div class="erp-m-lab">AI 思考频次</div></div>
                <div class="erp-card-metric"><div class="erp-m-val" id="m_team_size" style="color:#722ed1">0</div><div class="erp-m-lab">协作成员总数</div></div>
            </div>
            <div class="erp-chart-row">
                <div class="erp-card-chart">
                    <div class="erp-c-title">📈 消耗燃耗趋势图</div>
                    <div style="flex:1"><canvas id="trendChart"></canvas></div>
                </div>
                <div class="erp-card-chart">
                    <div class="erp-c-title">📊 成员贡献力排行</div>
                    <div style="flex:1"><canvas id="overviewBarChart"></canvas></div>
                </div>
            </div>
        </div>

        <div id="view_members" class="view-section">
            <div style="margin-bottom: 20px;">
                <select id="memberSelect" style="padding:10px; border-radius:8px; font-weight:bold; border:1px solid #ddd;" onchange="renderMemberData()"></select>
            </div>
            <div class="erp-card-table" style="height: 600px;">
                <div class="erp-t-header">💳 该成员积分流水清单</div>
                <div class="erp-t-body">
                    <table class="erp-table">
                        <thead><tr><th>时间</th><th>操作内容</th><th>消耗积分</th></tr></thead>
                        <tbody id="memberLogBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view_episodes" class="view-section">
            <div class="erp-table-row">
                <div class="erp-card-table">
                    <div class="erp-t-header">🎬 分集进度盘点</div>
                    <div class="erp-t-body">
                        <table class="erp-table">
                            <thead><tr><th>分集名</th><th>分镜</th><th>存图</th></tr></thead>
                            <tbody id="epTableBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="erp-card-table">
                    <div class="erp-t-header">🎨 资产归档状态</div>
                    <div class="erp-t-body">
                        <table class="erp-table">
                            <thead><tr><th>名称</th><th>类别</th><th>主图</th></tr></thead>
                            <tbody id="assetTableBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="erp-card-table">
                    <div class="erp-t-header">🕒 实时操作流</div>
                    <div class="erp-t-body">
                        <table class="erp-table">
                            <thead><tr><th>时间</th><th>操作人</th><th>动作</th></tr></thead>
                            <tbody id="liveLogBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="../js/app.js?v=9999"></script>
    <script>
        let allLogs = [];
        let allProjects = [];
        let currentProjectId = 'all';
        let currentView = 'overview';
        let trendChartObj = null, barChartObj = null;

        const ACTION_MAP = { 'gen_image': '在线生图', 'extract_elements': '剧本拆解', 'ai_thought': '提示词生成', 'split_script': '分镜拆分' };

        window.onload = async () => {
            if (!window.cloudSupabase) return;
            try {
                const { data: { user } } = await window.cloudSupabase.auth.getUser();
                if (!user) return;

                // 1. 获取项目及其成员 (直接连表或RPC)
                const { data: projs } = await window.cloudSupabase.rpc('get_my_projects', { my_email: user.email });
                allProjects = projs || [];

                // 2. 获取流水
                const { data: statsData } = await window.cloudSupabase.rpc('get_admin_resource_stats', { target_email: user.email });
                allLogs = statsData ? (statsData.usage_list || statsData) : [];
                allLogs.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

                renderProjectTabs();
                switchProject('all');
            } catch(e) { console.error(e); }
        };

        function switchView(v) {
            currentView = v;
            document.querySelectorAll('.erp-tab-v').forEach(b => b.classList.toggle('active', b.getAttribute('onclick').includes(v)));
            document.querySelectorAll('.view-section').forEach(s => s.classList.toggle('active', s.id === 'view_'+v));
            switchProject(currentProjectId);
        }

        function renderProjectTabs() {
            const row = document.getElementById('projectTabs');
            allProjects.forEach(p => {
                const div = document.createElement('div');
                div.className = 'erp-tab-p';
                div.innerText = p.name;
                div.onclick = () => switchProject(p.id);
                div.id = 'ptab_' + p.id;
                row.appendChild(div);
            });
        }

        function switchProject(pid) {
            currentProjectId = pid;
            document.querySelectorAll('.erp-tab-p').forEach(t => t.classList.toggle('active', (t.id === 'ptab_'+pid || (pid==='all' && t.innerText==='全盘总览'))));
            
            const logs = pid === 'all' ? allLogs : allLogs.filter(l => l.project_id === pid);
            const proj = pid === 'all' ? null : allProjects.find(p => p.id === pid);

            if(currentView === 'overview') renderOverview(logs, pid);
            if(currentView === 'members') renderMemberView(logs, pid);
            if(currentView === 'episodes') renderEpView(proj, logs);
        }

        function renderOverview(logs, pid) {
            document.getElementById('m_total_cost').innerText = logs.reduce((s,l) => s + l.credits_spent, 0);
            document.getElementById('m_img_count').innerText = logs.filter(l => l.action_type==='gen_image').length;
            document.getElementById('m_text_count').innerText = logs.filter(l => l.action_type!=='gen_image').length;
            
            let users = new Set();
            if(pid === 'all') allProjects.forEach(p => p.members?.forEach(m => users.add(m.email || m.user_email)));
            else allProjects.find(p => p.id === pid)?.members?.forEach(m => users.add(m.email || m.user_email));
            document.getElementById('m_team_size').innerText = Math.max(users.size, 1);

            // 图表更新
            const dateMap = {};
            logs.forEach(l => { const d = new Date(l.created_at).toLocaleDateString(); dateMap[d] = (dateMap[d]||0) + l.credits_spent; });
            const sortedDates = Object.keys(dateMap).sort();
            
            if(trendChartObj) trendChartObj.destroy();
            trendChartObj = new Chart(document.getElementById('trendChart'), {
                type: 'line',
                data: { labels: sortedDates, datasets: [{ label: '积分消耗', data: sortedDates.map(d => dateMap[d]), borderColor: '#1677ff', tension: 0.3, fill: true, backgroundColor: 'rgba(22,119,255,0.05)' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const userMap = {};
            logs.forEach(l => { const n = l.user_email.split('@')[0]; userMap[n] = (userMap[n]||0) + l.credits_spent; });
            const userNames = Object.keys(userMap).sort((a,b) => userMap[b] - userMap[a]);

            if(barChartObj) barChartObj.destroy();
            barChartObj = new Chart(document.getElementById('overviewBarChart'), {
                type: 'bar',
                data: { labels: userNames, datasets: [{ label: '贡献额', data: userNames.map(n => userMap[n]), backgroundColor: '#722ed1', borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderMemberView(logs, pid) {
            const sel = document.getElementById('memberSelect');
            const users = [...new Set(logs.map(l => l.user_email))];
            sel.innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join('');
            renderMemberData();
        }

        function renderMemberData() {
            const u = document.getElementById('memberSelect').value;
            const body = document.getElementById('memberLogBody');
            const uLogs = allLogs.filter(l => l.user_email === u && (currentProjectId==='all' || l.project_id===currentProjectId));
            body.innerHTML = uLogs.map(l => `<tr><td>${new Date(l.created_at).toLocaleString()}</td><td>${ACTION_MAP[l.action_type]||l.action_type}</td><td style="color:red;font-weight:bold">-${l.credits_spent}</td></tr>`).join('');
        }

        function renderEpView(proj, logs) {
            const eb = document.getElementById('epTableBody');
            const ab = document.getElementById('assetTableBody');
            const lb = document.getElementById('liveLogBody');

            lb.innerHTML = logs.slice(0, 50).map(l => `<tr><td>${new Date(l.created_at).toLocaleTimeString()}</td><td>${l.user_email.split('@')[0]}</td><td>${ACTION_MAP[l.action_type]||l.action_type}</td></tr>`).join('');

            if(!proj) { eb.innerHTML = ab.innerHTML = '<tr><td colspan="3" style="text-align:center">请选择具体项目</td></tr>'; return; }

            const pData = typeof proj.data === 'string' ? JSON.parse(proj.data) : (proj.data||{});
            const eps = pData.episodes || [];
            eb.innerHTML = eps.map(e => {
                let imgC = 0; e.data?.storyboardData?.forEach(r => imgC += (r.images?.length || 0));
                return `<tr><td>🎬 ${e.name}</td><td>${e.data?.storyboardData?.length || 0}</td><td style="color:#1677ff;font-weight:bold">${imgC}张</td></tr>`;
            }).join('');

            const pAssets = typeof proj.assets === 'string' ? JSON.parse(proj.assets) : (proj.assets||{});
            let flat = [];
            ['characters','scenes','props'].forEach(c => {
                pAssets[c]?.forEach(i => flat.push(`<tr><td>${i.name}</td><td><span class="erp-badge erp-badge-blue">${c}</span></td><td>${(i.img||i.forwardImg)?'✅':'❌'}</td></tr>`));
            });
            ab.innerHTML = flat.length ? flat.join('') : '<tr><td colspan="3">暂无资产</td></tr>';
        }

        function exportToExcel() {
            const data = currentProjectId === 'all' ? allLogs : allLogs.filter(l => l.project_id === currentProjectId);
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "消耗报表");
            XLSX.writeFile(wb, `AI导演_剧组数据报表_${Date.now()}.xlsx`);
        }
    </script>
</body>
</html>
