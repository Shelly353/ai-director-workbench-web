<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 独立生图控制台</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .credit-badge { background: #fff5f5; color: #ff6b6b; padding: 4px 10px; border-radius: 20px; font-weight: bold; border: 1px solid #ffd8d8; font-size: 12px; }
        
        .console-wrapper { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: #1e1e1e; 
            z-index: 9999; transition: transform 0.3s ease; 
            transform: translateY(calc(100% - 30px)); border-top: 1px solid #444; 
        }
        .console-wrapper.open { transform: translateY(0); }
        .console-header { height: 30px; background: #2d2d2d; color: #ccc; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 11px; cursor: pointer; user-select: none; }
        .console-header:hover { background: #3d3d3d; color: #fff; }
        .console-content { height: 120px; padding: 10px 20px; color: #4af626; font-family: 'Consolas', monospace; font-size: 11px; overflow-y: auto; box-sizing: border-box; white-space: pre-wrap; border-top: 1px solid #333; }

        body { background: #f2f3f5; margin: 0; padding: 20px; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; }
        
        .toolbar { background: #fff; padding: 15px 20px; border-radius: 10px; display: flex; gap: 15px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; flex-shrink: 0; }
        .toolbar select { padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; outline: none; }
        
        .main-workspace { display: flex; gap: 20px; flex: 1; min-height: 0; }
        
        .left-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow-y: auto; }
        .ref-section { border: 1px dashed #dcdfe6; border-radius: 8px; padding: 15px; background: #fafafa; }
        .ref-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .ref-item { position: relative; width: 80px; height: 80px; border-radius: 6px; overflow: hidden; border: 1px solid #eee; }
        .ref-item img { width: 100%; height: 100%; object-fit: cover; }
        .ref-del { position: absolute; top: 0; right: 0; background: rgba(245,63,63,0.9); color: #fff; width: 16px; height: 16px; font-size: 10px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        
        .rich-input { flex: 1; min-height: 120px; padding: 15px; border: 1px solid #dcdfe6; border-radius: 8px; outline: none; font-size: 14px; line-height: 1.6; overflow-y: auto; }
        .rich-input:focus { border-color: var(--primary); }
        .inline-pill { display: inline-flex; align-items: center; background: #e8f3ff; border: 1px solid #bcdcff; border-radius: 4px; padding: 2px 8px; margin: 0 4px; font-size: 12px; color: var(--primary); cursor: default; }
        .inline-pill img { width: 18px; height: 18px; object-fit: cover; border-radius: 2px; margin-right: 4px; }
        
        .right-panel { width: 45%; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
        .result-img-box { flex: 1; background: #1e1e1e; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .result-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        .result-status { color: #86909c; font-size: 14px; }
        .result-actions { padding: 15px; display: flex; gap: 10px; background: #fff; border-top: 1px solid #eee; }
        
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-danger { background: #f53f3f; color: #fff; }
        .btn-success { background: #00b42a; color: #fff; }
        .btn:disabled { background: #e5e6eb; color: #86909c; cursor: not-allowed; border-color: transparent; }

        #globalAssetModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        #globalAssetContent { background: #fff; width: 80%; height: 80%; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        #globalAssetGrid { display: flex; flex-wrap: wrap; gap: 15px; overflow-y: auto; flex: 1; margin-top: 15px; align-content: flex-start; }

        #mentionMenu { display: none; position: fixed; background: #fff; border: 1px solid #ddd; padding: 8px; border-radius: 8px; z-index: 2000; box-shadow: 0 8px 24px rgba(0,0,0,0.15); width: 260px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="toolbar">
        <strong style="font-size: 16px;">🎨 高级生图工作台</strong>
        <span style="color: #86909c; font-size: 12px; margin-right: auto;" id="rowIdDisplay"></span>
        
        <select id="modelSelect">
            <option value="wan2.7-image">Wan2.7 Image</option>
            <option value="doubao-seedream-5.0-lite">Doubao Seedream</option>
            <option value="gemini-3.1-flash-image-preview">Gemini 3.1 Flash</option>
        </select>
        
        <select id="ratioSelect">
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="21:9">21:9</option>
            <option value="1:1">1:1</option>
            <option value="4:3">4:3</option>
        </select>
        
        <label style="font-size: 12px; font-weight: bold; margin-left: 10px;">分辨率:</label>
        <select id="resolutionSelect">
            <option value="1K">1K (标准)</option>
            <option value="2K">2K (高清)</option>
            <option value="4K">4K (超清)</option>
        </select>
        <span class="credit-badge" id="headerCredit" style="cursor:pointer;" onclick="showRechargeModal()">💎 积分: ...</span>
    </div>

    <div class="main-workspace">
        <div class="left-panel">
            <div class="ref-section">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 13px; font-weight: bold;">📚 参考资产池 (输入 @ 即可调用)</span>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-outline" onclick="openGlobalAssetModal()">+ 导入全局云端资产</button>
                        <button class="btn btn-outline" onclick="document.getElementById('localUploader').click()">+ 本地上传</button>
                        <input type="file" id="localUploader" accept="image/*" style="display:none;" onchange="handleLocalUpload(event)">
                    </div>
                </div>
                <div class="ref-grid" id="refGrid"></div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 13px; font-weight: bold;">📝 画面提示词 (风格已自动继承)</span>
            </div>
            <div class="rich-input" id="promptInput" contenteditable="true" data-placeholder="详细描述画面内容... 输入 @ 插入上方参考图..."></div>
            
            <button id="btnGenerate" class="btn btn-primary" style="padding: 12px; font-size: 14px;" onclick="generateImage()">🚀 开始生成画面</button>
        </div>

        <div class="right-panel">
            <div class="result-img-box" id="resultBox">
                <span class="result-status" id="resultStatus">等待生图...</span>
                <img id="resultImg" src="">
            </div>
            <div class="result-actions">
                <button id="btnConfirm" class="btn btn-success" style="flex:1; display:none;" onclick="confirmAndReturn()">✅ 确认并添加到分镜</button>
                <button id="btnDownload" class="btn btn-outline" style="display:none;" onclick="downloadImage()">📥 下载</button>
                <button id="btnDelete" class="btn btn-danger" style="display:none;" onclick="clearResult()">🗑️ 放弃</button>
            </div>
        </div>
    </div>

    <div id="globalAssetModal">
        <div id="globalAssetContent">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:15px;">
                <h3 style="margin:0;">📥 从项目资产库提取至画板</h3>
                <span style="cursor:pointer; font-size:24px; color:#86909c; line-height:1;" onclick="document.getElementById('globalAssetModal').style.display='none'">×</span>
            </div>
            
            <div style="display:flex; gap:10px; margin-top:15px; border-bottom:1px solid #eee; padding-bottom:15px; flex-wrap:wrap;">
                <button id="tab_characters" class="btn btn-primary" onclick="loadLibraryTab('characters')">👤 人物</button>
                <button id="tab_scenes" class="btn btn-outline" onclick="loadLibraryTab('scenes')">🏞️ 场景</button>
                <button id="tab_props" class="btn btn-outline" onclick="loadLibraryTab('props')">🧸 道具</button>
                <button id="tab_effects" class="btn btn-outline" onclick="loadLibraryTab('effects')">✨ 特效</button>
                <button id="tab_private" class="btn btn-outline" style="margin-left:auto; border-color:#722ed1; color:#722ed1;" onclick="loadLibraryTab('private')">🔒 我的私有关键帧</button>
            </div>

            <div id="globalAssetGrid"></div>
        </div>
    </div>

    <div id="mentionMenu"><div id="mentionMenuGrid" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:6px;"></div></div>
    
    <div class="console-wrapper" id="consoleWrapper">
        <div class="console-header" onclick="toggleConsole()">
            <span>📝 实时运行日志 (调试模式)</span>
            <span id="consoleToggleIcon">▲ 点击展开</span>
        </div>
        <div class="console-content" id="logConsole"></div>
    </div>

    <script src="../js/app.js?v=9999"></script>
    <script>
        async function fetchCredits() {
            const userId = localStorage.getItem('userId');
            if (!userId || !window.cloudSupabase) return;
            try {
                const { data } = await window.cloudSupabase.from('profiles').select('credits').eq('user_id', userId).single();
                if (data) {
                    document.getElementById('headerCredit').innerText = `💎 积分: ${data.credits}`;
                    localStorage.setItem('userCredits', data.credits);
                }
            } catch (e) { console.error("获取积分失败:", e); }
        }

        async function checkAndDeductCredits(actionKey, modelName) {
            const isGemini = modelName.toLowerCase().includes('gemini');
            if (!window.cloudSupabase) return false;

            const { data: newCredits, error } = await window.cloudSupabase.rpc('deduct_credits_v2', { 
                action_key: actionKey, 
                is_gemini: isGemini 
            });

            if (error) { alert(`❌ 操作失败：${error.message}`); return false; }
            document.getElementById('headerCredit').innerText = `💎 积分: ${newCredits}`;
            localStorage.setItem('userCredits', newCredits);
            log(`💎 扣费成功，剩余 ${newCredits} 💎。`);
            return true;
        }

        // 🌟 物料追踪埋点
        async function logProduction(assetName, mediaType, sourceType, cost, modelName) {
            try {
                let pid = 'unknown_project';
                try {
                    const ctx = await DB.get('active_context');
                    if (ctx && ctx.projectId) pid = ctx.projectId;
                } catch(err) {}

                const { data: { user } } = await window.cloudSupabase.auth.getUser();
                if (!user) return;
                
                await window.cloudSupabase.from('asset_production_logs').insert([{
                    project_id: pid,
                    user_email: user.email,
                    asset_name: assetName,
                    media_type: mediaType,
                    source_type: sourceType,
                    credits_spent: Number(cost) || 0,
                    model_name: modelName || 'N/A'
                }]);
            } catch(e) { console.warn("追踪日志记录失败", e); }
        }

        function toggleConsole() { const w = document.getElementById('consoleWrapper'); w.classList.toggle('open'); document.getElementById('consoleToggleIcon').innerText = w.classList.contains('open') ? '▼ 点击折叠' : '▲ 点击展开'; }
        function log(msg) { const c = document.getElementById('logConsole'); if(c){ c.innerText += `[${new Date().toLocaleTimeString()}] ${msg}\n`; c.scrollTop = c.scrollHeight; } }

        const STYLE_MODIFIERS = {
            "realistic": "Award-winning photography, photorealistic portrait, highly detailed skin texture, 2k resolution, cinematic lighting, shot on 35mm lens, realistic human skin. ",
            "anime": "Anime style, 2D flat shading, cel shaded, anime character design. ",
            "comic": "Marvel/DC comic book style, bold outlines, halftone shading. ",
            "cyberpunk": "Cyberpunk aesthetic, neon rim lighting, high-tech cybernetics. ",
            "ink": "Traditional Chinese ink wash painting style, ethereal mood. "
        };

        let rowId = new URLSearchParams(window.location.search).get('rowId');
        let localRefPool = []; 
        let globalStyle = null;
        let savedRange = null;
        let generatedB64 = null;

        window.onload = async () => {
            const userId = localStorage.getItem('userId');
            if (!userId) { window.location.replace('index.html'); return; }

            await fetchCredits();
            document.getElementById('rowIdDisplay').innerText = `目标分镜: ${rowId || '独立面板'}`;
            
            globalStyle = await DB.get('styleSelect');
            const savedRatio = await DB.get('globalRatio');
            if(savedRatio) document.getElementById('ratioSelect').value = savedRatio;
            
            const imgConfig = await DB.get('image_config');
            if(imgConfig && imgConfig.model) document.getElementById('modelSelect').value = imgConfig.model;

            document.getElementById('promptInput').addEventListener('input', handleRichInput);
            renderRefGrid();
        };

        async function openGlobalAssetModal() {
            document.getElementById('globalAssetModal').style.display = 'flex';
            loadLibraryTab('characters'); 
        }

        async function loadLibraryTab(tabType) {
            ['characters', 'scenes', 'props', 'effects', 'private'].forEach(t => {
                const btn = document.getElementById('tab_' + t);
                if (btn) {
                    if (t === 'private') {
                        btn.className = (t === tabType) ? 'btn btn-primary' : 'btn btn-outline';
                        btn.style.color = (t === tabType) ? '#fff' : '#722ed1';
                        btn.style.borderColor = (t === tabType) ? 'transparent' : '#722ed1';
                    } else {
                        btn.className = (t === tabType) ? 'btn btn-primary' : 'btn btn-outline';
                    }
                }
            });

            const grid = document.getElementById('globalAssetGrid');
            grid.innerHTML = "<div style='width:100%; text-align:center; padding:40px; color:#86909c;'>⏳ 正在从云端拉取资产...</div>";

            try {
                const ctx = await DB.get('active_context');
                if (!ctx || !ctx.projectId) throw new Error("无法识别当前项目归属！");
                
                const { data: { user } } = await window.cloudSupabase.auth.getUser();
                let pool = [];

                if (tabType !== 'private') {
                    const { data: sharedData } = await window.cloudSupabase.from('shared_projects').select('assets').eq('id', ctx.projectId).single();
                    if (sharedData && sharedData.assets) {
                        let ast = typeof sharedData.assets === 'string' ? JSON.parse(sharedData.assets) : sharedData.assets;
                        if (ast[tabType]) {
                            ast[tabType].forEach(item => {
                                if (tabType === 'scenes') {
                                    if(item.forwardImg) pool.push({name: item.name+'-正视', b64: item.forwardImg, label: '场景'});
                                    if(item.reverseImg) pool.push({name: item.name+'-反打', b64: item.reverseImg, label: '场景'});
                                } else {
                                    if(item.img) pool.push({name: item.name, b64: item.img, label: '资产'});
                                }
                                if(item.refImages && item.refImages.length > 0) {
                                    item.refImages.forEach((rUrl, i) => { pool.push({name: `${item.name}-参考${i+1}`, b64: rUrl, label: '参考'}); });
                                }
                            });
                        }
                    }
                } else {
                    const { data: privateData } = await window.cloudSupabase.from('private_keyframes').select('img_url').eq('project_id', ctx.projectId).eq('user_email', user.email);
                    if (privateData) privateData.forEach((k, i) => pool.push({ name: `私有图片 ${i+1}`, b64: k.img_url, label: '私有' }));
                }

                if (pool.length === 0) {
                    grid.innerHTML = "<div style='width:100%; text-align:center; padding:50px; color:#c9cdd4;'>此分类下暂无资产数据。</div>";
                    return;
                }

                grid.innerHTML = pool.map(item => `
                    <div style="width:110px; cursor:pointer; text-align:center; padding:5px; border:2px solid transparent; border-radius:8px; transition:0.2s;" 
                         onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='transparent'" 
                         onclick="addRefToPool('${item.name}', '${item.b64}')">
                        <img src="${item.b64}" style="width:100px; height:100px; object-fit:cover; border-radius:6px; border:1px solid #e5e6eb;">
                        <div style="font-size:11px; margin-top:6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;" title="${item.name}">${item.name}</div>
                        <div style="font-size:10px; color:var(--primary); background:#e8f3ff; border-radius:4px; display:inline-block; padding:2px 6px; margin-top:2px;">${item.label}</div>
                    </div>
                `).join('');

            } catch (e) {
                grid.innerHTML = `<div style='width:100%; text-align:center; padding:20px; color:#f53f3f;'>❌ 加载失败: ${e.message}</div>`;
            }
        }

        function addRefToPool(name, b64) {
            if(!localRefPool.find(x => x.b64 === b64)) { localRefPool.push({ name, b64 }); renderRefGrid(); }
            document.getElementById('globalAssetModal').style.display = 'none';
        }

        function removeRef(index) { localRefPool.splice(index, 1); renderRefGrid(); }

        function renderRefGrid() {
            const grid = document.getElementById('refGrid');
            if (!grid) return;
            if (localRefPool.length === 0) { grid.innerHTML = '<span style="font-size:12px; color:#c9cdd4;">暂无参考图，请导入或上传。</span>'; return; }
            grid.innerHTML = localRefPool.map((item, i) => `
                <div class="ref-item"><img src="${item.b64}"><div class="ref-del" onclick="removeRef(${i})">×</div></div>
            `).join('');
        }

        async function handleLocalUpload(e) {
            const file = e.target.files[0];
            if(!file) return;
            log(`⏳ 正在将本地参考图转存至云端图床...`);
            try {
                const cloudUrl = await window.uploadMediaToCloud(file);
                if (cloudUrl) {
                    localRefPool.push({ name: file.name || '本地图片', b64: cloudUrl });
                    renderRefGrid();
                    log(`✅ 参考图已就绪：${cloudUrl}`);
                    // 🌟 埋点上传
                    logProduction(file.name || '本地参考图', "图片", "本地上传", 0, "本地文件");
                }
            } catch (err) { log(`❌ 上传失败: ${err.message}`); }
            e.target.value = '';
        }

        function handleRichInput(e) {
            const sel = window.getSelection();
            if(sel.rangeCount === 0) return;
            const range = sel.getRangeAt(0);
            const text = range.startContainer.textContent.substring(0, range.startOffset);
            if (text.endsWith('@')) {
                if(localRefPool.length === 0) return alert("参考资产池为空，请先添加参考图！");
                savedRange = range.cloneRange();
                const rect = range.getBoundingClientRect();
                const menu = document.getElementById('mentionMenu');
                menu.style.display = 'block'; menu.style.left = rect.left + 'px'; menu.style.top = (rect.bottom + window.scrollY + 8) + 'px';
                document.getElementById('mentionMenuGrid').innerHTML = localRefPool.map((item) => `
                    <div style="aspect-ratio:1; border-radius:4px; overflow:hidden; cursor:pointer;" onmousedown="event.preventDefault();insertMentionPill('${item.b64}', '${item.name}')">
                        <img src="${item.b64}" style="width:100%;height:100%;object-fit:cover;">
                    </div>
                `).join('');
            } else { document.getElementById('mentionMenu').style.display = 'none'; }
        }

        function insertMentionPill(b64, name) {
            document.getElementById('mentionMenu').style.display = 'none';
            const sel = window.getSelection();
            sel.removeAllRanges(); sel.addRange(savedRange);
            savedRange.setStart(savedRange.startContainer, savedRange.startOffset - 1);
            savedRange.deleteContents();
            const span = document.createElement('span');
            span.className = 'inline-pill'; span.contentEditable = 'false'; span.setAttribute('data-b64', b64);
            span.innerHTML = `<img src="${b64}"><span>${name}</span>`;
            savedRange.insertNode(span);
            savedRange.setStartAfter(span); savedRange.insertNode(document.createTextNode('\u00A0'));
            savedRange.collapse(false); sel.removeAllRanges(); sel.addRange(savedRange);
        }

        async function generateImage() {
            const inputEl = document.getElementById('promptInput');
            const modelSelect = document.getElementById('modelSelect');
            const selectedModel = modelSelect.value;
            const ratioVal = document.getElementById('ratioSelect').value;
            
            let rawText = ""; let inlineImgs = [];
            
            inputEl.childNodes.forEach(node => {
                if (node.nodeType === Node.TEXT_NODE) rawText += node.textContent;
                else if (node.nodeType === Node.ELEMENT_NODE) {
                    if (node.classList.contains('inline-pill')) {
                        inlineImgs.push(node.getAttribute('data-b64'));
                        rawText += ` [参考图${inlineImgs.length}: ${node.innerText}] `;
                    } else { rawText += node.innerText; }
                }
            });

            if(!rawText.trim() && inlineImgs.length === 0) return alert("提示词不能为空！");
            if (!(await checkAndDeductCredits('gen_image', selectedModel))) return;

            // 🌟 埋点记录生图消耗
            const costEst = selectedModel.includes('doubao') ? 1 : 2;
            logProduction("浮窗视效抽卡", "图片", "AI生成", costEst, selectedModel);

            const resVal = document.getElementById('resolutionSelect').value;
            let sizeVal = "1920*1080"; 
            if (resVal === '1K') {
                if (ratioVal === "9:16") sizeVal = "720*1280";
                else if (ratioVal === "1:1") sizeVal = "1024*1024";
                else if (ratioVal === "21:9") sizeVal = "1280*548";
                else if (ratioVal === "4:3") sizeVal = "1024*768";
                else sizeVal = "1280*720";
            } else if (resVal === '2K') {
                if (ratioVal === "9:16") sizeVal = "1440*2560";
                else if (ratioVal === "1:1") sizeVal = "2048*2048";
                else if (ratioVal === "21:9") sizeVal = "2560*1080";
                else if (ratioVal === "4:3") sizeVal = "2048*1536";
                else sizeVal = "2560*1440";
            } else if (resVal === '4K') {
                if (ratioVal === "9:16") sizeVal = "2160*3840";
                else if (ratioVal === "1:1") sizeVal = "4096*4096";
                else if (ratioVal === "21:9") sizeVal = "3840*1600";
                else if (ratioVal === "4:3") sizeVal = "4096*3072";
                else sizeVal = "3840*2160";
            }
            const stylePrefix = (globalStyle && STYLE_MODIFIERS[globalStyle]) ? STYLE_MODIFIERS[globalStyle] : "";
            const sysInject = inlineImgs.length > 1 ? "【系统指令：请识别提示词中的[参考图X]标识，将多个参考对象的特征融合】" : "";
            const finalPrompt = stylePrefix + sysInject + rawText;
            
            const btn = document.getElementById('btnGenerate');
            const status = document.getElementById('resultStatus');
            btn.disabled = true; btn.innerText = `⏳ 生成中...`;
            clearResult();
            status.innerText = `🚀 正在提交...`;

            try {
                const res = await apiRequest('/api/image/create', { model: selectedModel, prompt: finalPrompt, images: inlineImgs, ratio: ratioVal, size: sizeVal, async_mode: true });
                let b64 = "";

                if (res.taskId) {
                    log(`✅ 排队成功，TaskID: ${res.taskId}`);
                    while (true) {
                        await new Promise(resolve => setTimeout(resolve, 3500));
                        let currentUrl = typeof API_BASE !== 'undefined' ? API_BASE : "https://proxy-server-web.onrender.com"; 
                        const userToken = localStorage.getItem('userToken');

                        const pollRes = await fetch(`${currentUrl}/api/dashscope/poll/${res.taskId}`, { method: 'GET', headers: { 'Authorization': `Bearer ${userToken}` } });
                        if (!pollRes.ok) throw new Error(`轮询失败 HTTP ${pollRes.status}`);
                        const pollData = await pollRes.json();
                        const taskStatus = pollData.output?.task_status || pollData.task_status;
                        
                        if (taskStatus === 'SUCCEEDED') {
                            const out = pollData.output || {};
                            if (out.results && out.results.length > 0) b64 = out.results[0].url || out.results[0].image_url;
                            else if (out.choices && out.choices[0]?.message?.content) {
                                const content = out.choices[0].message.content;
                                const imgItem = Array.isArray(content) ? content.find(c => c.image || c.url) : null;
                                if (imgItem) b64 = imgItem.image || imgItem.url; else if (typeof content === 'string' && content.startsWith('http')) b64 = content;
                            } else if (out.image_url) b64 = out.image_url;
                            else if (out.image) b64 = out.image;
                            if (!b64) throw new Error("提取图片链接失败");
                            break;
                        } else if (taskStatus === 'FAILED') { throw new Error(`阿里云生图失败: ${pollData.output?.message || pollData.message}`); }
                    }
                } else if (res.data && res.data.length > 0) { b64 = res.data[0].url; } else throw new Error("未包含图片地址或 TaskID");

                const imgEl = document.getElementById('resultImg'); 
                if (b64.startsWith('http')) {
                    status.innerText = "📥 AI 绘制完毕，正在安全下载图片...";
                    try {
                        const imgRes = await fetch(b64);
                        if (!imgRes.ok) throw new Error("CORS Blocked");
                        const blob = await imgRes.blob();
                        b64 = await new Promise(r => { const rd = new FileReader(); rd.onloadend = () => r(rd.result); rd.readAsDataURL(blob); });
                    } catch (corsErr) {
                        const proxyRes = await apiRequest('/api/proxy-image', { url: b64 });
                        if (proxyRes.base64) b64 = proxyRes.base64; else throw new Error("代理下载图片失败");
                    }
                }

                status.innerText = "☁️ 正在永久保存至云端...";
                b64 = await window.uploadMediaToCloud(b64, 'png');
                
                generatedB64 = b64; imgEl.src = b64; 
                imgEl.onload = () => { status.style.display = 'none'; imgEl.style.display = 'block'; };

                document.getElementById('btnConfirm').style.display = 'block'; document.getElementById('btnDownload').style.display = 'block'; document.getElementById('btnDelete').style.display = 'block';
            } catch (e) {
                status.innerText = `❌ 生图失败: ${e.message}`; log(`❌ 生图失败: ${e.message}`);
            } finally { btn.disabled = false; btn.innerText = "🚀 重新生成画面"; }
        }

        function clearResult() {
            generatedB64 = null;
            document.getElementById('resultImg').style.display = 'none'; document.getElementById('resultImg').src = '';
            document.getElementById('resultStatus').style.display = 'block'; document.getElementById('resultStatus').innerText = "等待生图...";
            document.getElementById('btnConfirm').style.display = 'none'; document.getElementById('btnDownload').style.display = 'none'; document.getElementById('btnDelete').style.display = 'none';
        }

        function downloadImage() { if(!generatedB64) return; const a = document.createElement('a'); a.href = generatedB64; a.download = `AI_Gen_${Date.now()}.png`; a.click(); }

        async function confirmAndReturn() {
            if(!generatedB64) return;
            
            try {
                const ctx = await DB.get('active_context');
                const { data: { user } } = await window.cloudSupabase.auth.getUser();
                
                if (!ctx || !ctx.projectId) throw new Error("无法识别当前项目归属！");

                const { data, error } = await window.cloudSupabase.from('private_keyframes').insert([{ 
                    project_id: ctx.projectId, 
                    user_email: user.email, 
                    img_url: generatedB64 
                }]).select();
                
                if (error) throw error;
                if (!data || data.length === 0) {
                    alert("🚨 保存被静默拦截！请检查 RLS 设置。");
                    return; 
                }
                log(`✅ 已安全保存至您的【私有关键帧库】！`);
            } catch (err) {
                console.error("保存私有关键帧失败:", err);
                log(`❌ 保存失败: ${err.message}`);
                alert(`保存失败：${err.message}`);
                return; 
            }

            if (window.parent && window.parent.addGeneratedImageToRow) { 
                window.parent.addGeneratedImageToRow(rowId, generatedB64); 
            } else { 
                alert("✅ 已成功保存到云端资产库！"); 
            }
        }
    </script>
</body>
</html>
