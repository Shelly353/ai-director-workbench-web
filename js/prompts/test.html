<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>云端服务 - 构图压力测试</title>
    <link rel="stylesheet" href="css/style.css"> <!-- 引用你的全局样式[cite: 4] -->
    <style>
        body { padding: 40px; background: #f4f5f7; }
        .test-container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 120px; margin: 15px 0; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        .log-box { background: #1d2129; color: #4af626; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; height: 150px; overflow-y: auto; white-space: pre-wrap; margin-top: 20px; }
        #preview { margin-top: 20px; min-height: 400px; border: 2px dashed #eee; display: flex; align-items: center; justify-content: center; background: #fafafa; }
        img { max-width: 100%; height: auto; border-radius: 4px; }
    </style>
</head>
<body>

<div class="test-container">
    <h2>🛠️ 提示词原生性能测试 (对齐云端)</h2>
    
    <label>1. 选择模型与参数:</label>
    <div style="margin-bottom: 15px;">
        <select id="modelSelect" style="padding: 10px; border-radius: 6px;">
            <option value="wan2.7-image">Wan2.7 Image</option>
            <option value="gemini-3.1-flash-image-preview">Gemini 3.1 Flash</option>
        </select>
        <select id="sizeSelect" style="padding: 10px; border-radius: 6px;">
            <option value="1280*720">1280*720 (16:9)</option>
            <option value="1920*1080">1920*1080 (16:9)</option>
        </select>
    </div>

    <label>2. 粘贴官网验证成功的提示词:</label>
    <textarea id="promptInput">生成人物三视图，画面中必须包含了人物的头和脚。从左到右是面部细节图、正视图、侧视图、背视图。一个男人带眼镜穿中山装。纯白背景，不要出现文字，不要参考线，不要特效，不要道具。</textarea>

    <button id="runBtn" class="btn btn-primary" style="width: 100%;">🚀 发送请求到云端</button>

    <div id="preview">图片结果将显示在此处</div>
    <div class="log-box" id="logBox">等待操作...</div>
</div>

<!-- 🌟 引用主程序的 app.js，确保鉴权和路径一致[cite: 4] -->
<script src="js/app.js"></script>

<script>
    const logBox = document.getElementById('logBox');
    function print(msg) {
        logBox.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    document.getElementById('runBtn').onclick = async function() {
        const prompt = document.getElementById('promptInput').value;
        const model = document.getElementById('modelSelect').value;
        const size = document.getElementById('sizeSelect').value;

        this.disabled = true;
        this.innerText = "⏳ 正在请求云端...";
        print(`>>> 开始测试: ${model} | ${size}`);

        try {
            // 🌟 直接调用 app.js 中的 apiRequest 函数，它会自动处理云端 URL 和暗号[cite: 4]
            const res = await apiRequest('/api/image/create', {
                model: model,
                prompt: prompt,
                ratio: "16:9",
                size: size
            });

            if (res && res.data && res.data[0].url) {
                print("✅ 生成成功！");
                document.getElementById('preview').innerHTML = `<img src="${res.data[0].url}">`;
            } else {
                print("❌ 响应异常: " + JSON.stringify(res));
            }
        } catch (e) {
            print(`❌ 连接失败: ${e.message}`);
            print("💡 建议：请确保通过云端提供的 URL 访问此页面，不要直接打开本地文件。");
        } finally {
            this.disabled = false;
            this.innerText = "🚀 发送请求到云端";
        }
    };
</script>
</body>
</html>
