async function fetchCredits() {
    const userId = localStorage.getItem('userId');
    if (!userId) return;
    try {
        const { data, error } = await supabaseClient
            .from('profiles')
            .select('credits')
            .eq('user_id', userId)
            .single();
        if (data) {
            // 将云端积分渲染到页面右上角

async function checkAndDeductCredits(cost, taskName) {
    const userId = localStorage.getItem('userId');
    if (!userId) {
        alert("登录已过期，请重新登录！");
        return false;
    }
    try {
        // 1. 实时查账
        const { data, error } = await supabaseClient.from('profiles').select('credits').eq('user_id', userId).single();
        if (error || !data) throw new Error("查账失败");
        
        // 2. 判断余额
        if (data.credits < cost) {
            alert(`❌ 积分不足！\n\n执行【${taskName}】需要 ${cost} 💎\n您当前剩余: ${data.credits} 💎\n请充值后重试。`);
            return false; // 余额不足，拒绝放行
        }
        
        // 3. 执行云端扣费
        const newCredits = data.credits - cost;
        const { error: updateError } = await supabaseClient.from('profiles').update({ credits: newCredits }).eq('user_id', userId);
        if (updateError) throw updateError;
        
        // 4. 扣费成功，更新本地口袋并打印日志
        localStorage.setItem('userCredits', newCredits);
        if(typeof log === 'function') log(`💎 扣费成功：[${taskName}] 消耗 ${cost} 积分，剩余 ${newCredits} 💎。`);
        return true; // 放行！
    } catch (err) {
        console.error("扣费异常:", err);
        alert("计费系统网络异常，请稍后重试。");
        return false;
    }

  "effects": [{"name": "提取的特效名称", "description": "光效、粒子等视觉表现描述"}]
}`;

                const res = await apiRequest(endpoint, { 
                    model: apiModelName, 
                    stream: false, 
                    response_format: { "type": "json_object" },
                    messages: [
                        { role: "system", content: sysPrompt + "\n当前风格要求：" + styleName + "\n" + strictFormat },
                        { role: "user", content: "剧本内容如下：\n" + text }
                    ] 
                });
                
                let jsonStr = "";
                if (res.choices && res.choices[0].message) {
                    jsonStr = res.choices[0].message.content; 
                } else if (res.candidates && res.candidates[0].content) {
                    jsonStr = res.candidates[0].content.parts[0].text; 
                } else {
                    throw new Error("无法解析模型返回的数据结构");
                }

                jsonStr = jsonStr.replace(/```json/gi, '').replace(/```/g, '').trim();
                const firstBrace = jsonStr.indexOf('{');
                const lastBrace = jsonStr.lastIndexOf('}');
                if (firstBrace !== -1 && lastBrace !== -1) {
                    jsonStr = jsonStr.substring(firstBrace, lastBrace + 1);
                }

                let data = {};
                try {
                    data = JSON.parse(jsonStr);
                } catch (parseErr) {
                    console.error("JSON 解析失败: ", jsonStr);
                    throw new Error("大模型返回的内容不是有效的 JSON 格式。");
                }

                const targetData = data.data || data.result || data;
                const chars = targetData.characters || targetData['人物'] || targetData['角色'] || [];
                const scenes = targetData.scenes || targetData['场景'] || targetData['场景列表'] || [];
                const props = targetData.props || targetData['道具'] || [];
                const effects = targetData.effects || targetData['特效'] || [];

                if (chars.length === 0 && scenes.length === 0 && props.length === 0 && effects.length === 0) {
                    console.warn("解析出的空数据体：", data);
                    throw new Error("大模型未提取到任何元素，可能是未理解剧本内容。");
                }

                const normalize = (arr, category) => (Array.isArray(arr) ? arr : []).map((x, i) => ({
                    name: x.name || x.title || x.character || x.prop || x.effect || `${category}_${i+1}`,
                    description: x.description || x.desc || '',
                    img: null,
                    refImages: []
                }));

                extractedData.characters = normalize(chars, '人物');
                extractedData.props = normalize(props, '道具');
                extractedData.effects = normalize(effects, '特效');
                extractedData.scenes = (Array.isArray(scenes) ? scenes : []).map((x, i) => ({
                    name: x.name || x.scene || x.location || `场景_${i+1}`,
                    description: x.description || x.desc || '',
                    forwardDesc: x.description || x.desc || '', // 独立正视图文案
                    reverseDesc: '', // 独立反打图文案
                    forwardImg: null,
                    reverseImg: null,
                    refImages: []
                }));
                
                log("✨ 视觉要素提取成功！");
                renderAssetsUI();
            } catch (e) { 
                let errMsg = e.message;
                if (errMsg.includes('limit: 0') || errMsg.includes('429') || errMsg.includes('404')) {
                    log(`⚠️ 触发 Google 免费版区域限流或模型封锁，已自动降级为您切换至 DeepSeek。`);
                    alert(`Google 接口触发了封锁（Limit: 0 / 429）或模型不存在。\n\n系统已为您自动切换至【DeepSeek】模型，请重新点击“提取视觉四要素”即可正常使用！`);
                    
                    document.getElementById('llmModelSelect').value = 'deepseek-chat';
                    DB.set('llmModelSelect', 'deepseek-chat');
                } else {
                    log(`❌ 提取失败：${e.message}`);
                    alert("提取失败：" + errMsg); 
                }
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
                validateExtractBtn(); 
            }
        }

                        listDiv.innerHTML += createAssetHTML(category, index, item.name, item.description, 'reverse', '反打');

        function insertPill(b64) {
            document.getElementById('mentionMenu').style.display='none';
            const sel = window.getSelection(); 
            sel.removeAllRanges(); 
            sel.addRange(savedRange);
            savedRange.setStart(savedRange.startContainer, savedRange.startOffset - 1);
            savedRange.deleteContents();
            const span = document.createElement('span');
            span.className = 'inline-pill'; span.contentEditable = 'false';
            span.setAttribute('data-b64', b64);
            span.innerHTML = `<img src="${b64}">Ref`;
            
            span.onmouseenter = (e) => {
                const hp = document.getElementById('hoverPreview');
                document.getElementById('hoverImg').src = b64;
                hp.style.display = 'block';
                hp.style.left = (e.clientX + 15) + 'px'; hp.style.top = (e.clientY + 15) + 'px';
            };
            span.onmouseleave = () => { document.getElementById('hoverPreview').style.display='none'; };
            
            savedRange.insertNode(span);
            const space = document.createTextNode('\u00A0');
            savedRange.setStartAfter(span); savedRange.insertNode(space);
            savedRange.collapse(false); 
            sel.removeAllRanges(); 
            sel.addRange(savedRange);
        }

            }
        }

        function addAsset(cat) { if (cat === 'scenes') extractedData.scenes.push({ name: '新场景', description: '', forwardDesc: '', reverseDesc: '', forwardImg: null, reverseImg: null, refImages: [] }); else extractedData[cat].push({ name: '新项目', description: '', img: null, refImages: [] }); renderAssetsUI(); }
        function deleteAsset(cat, idx) { if (confirm(`确认删除？`)) { extractedData[cat].splice(idx, 1); renderAssetsUI(); } }
        function updateDataName(cat, idx, val) { extractedData[cat][idx].name = val; saveCurrentState(); }
        function updateDataDesc(cat, idx, type, val) { 
            if (cat === 'scenes') {
                if (type === 'forward') extractedData[cat][idx].forwardDesc = val;
                else extractedData[cat][idx].reverseDesc = val;
            } else {
                extractedData[cat][idx].description = val;
            }
            saveCurrentState(); 
        }
        function togglePrompt(divId) { const d = document.getElementById(`promptDialog_${divId}`); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
        
        async function goToNextStep() {
            const s = document.getElementById('scriptInput').value.trim();
            if (!s) return alert("剧本不能为空！");
            try { await DB.set('scriptText', s); } catch(e){}
            location.href = 'html/module2.html';
        }
// 🌟 新增：保存第一步的剧本与视觉资产，并返回项目工作台
        async function saveAndBack() {
            try {
                // 保存剧本输入框的内容
                const s = document.getElementById('scriptInput').value.trim();
                if (s) {
                    await DB.set('scriptText', s);
                }
                
                // 确保触发页面上已有的全局资产保存
                await saveCurrentState();
                
                // 🌟 注意：这里和 module2/3 不同，不需要 ../ 前缀
                location.href = 'dashboard.html';
            } catch (e) {
                // 即使保存失败也强制返回
                location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
